<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Platform-Specific Writing Adaptation Prompt</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .sub-header {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
      white-space: pre-line;
      line-height: 1.6;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 110px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 600px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .sub-header { font-size: 0.9rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Platform-Specific Writing Adaptation Prompt</h1>
      <p class="sub-header">(হাত খুলে লেখো - “মন কি বাত” 
Verify -” own realization”
Translate with “Platform-Specific Writing Adaptation Prompt”)</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Dynamic Input Field -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data</span>
          <button class="clear-btn" onclick="resetInput('inputPlatform')">Reset</button>
        </div>
        <label for="inputPlatform">[Platform Name]</label>
        <textarea id="inputPlatform" class="dynamic-input" placeholder="Type or paste the Platform Name here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Container -->
      <div id="promptsContainer">
        <!-- Injected via JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `Based on our ongoing discussion, if I want to publish my writing on [Platform Name], what should I do to make it suitable for that platform while preserving my distinctive writing style?

My Non-Negotiable Principle

I am willing to adapt my content to the platform, but I am not willing to change my distinctive writing style simply to please its algorithm.

Mandatory Rules

1. Preserve my distinctive writing style.

Do not reshape my writing to satisfy a platform's presumed algorithmic preferences. Editorial decisions must serve the integrity of my work, not force it into a generic formula for visibility or engagement.

Preserve my distinctive voice, imagery, rhythm, reasoning, perspective, and emotional expression. Improve clarity, accessibility, readability, and presentation where necessary, but do not dilute or replace my individuality as a writer.

2. Adapt the presentation, not my identity.

The governing principle is simple: adapt how my work is presented to suit the platform, but do not adapt my identity as a writer to please its algorithm.

You may recommend changes to the format, structure, length, title, headings, opening, paragraphing, and other presentation elements when they genuinely suit the platform and serve the reader.

Do not recommend changes merely because they are assumed to improve algorithmic performance. Distinguish established platform requirements and documented practices from speculation, conventional advice, and unverified algorithmic assumptions.

3. Explain the adaptation strategy before rewriting.

First, explain what needs to be adapted to make my writing suitable for [Platform Name], what should remain unchanged, and why.

Identify any platform-specific requirements, reader expectations, formatting conventions, and practical limitations that are relevant to my work.

Do not rewrite or restructure my content before establishing this adaptation strategy.

4. Provide the complete outline before drafting.

Once the adaptation strategy is established, provide the complete proposed outline of the content, covering every part in the intended order.

Briefly explain the purpose of each part and how it contributes to the overall piece. Ensure that the outline preserves the original argument, reasoning, distinctive perspective, and intended emotional effect.

5. Write in simple Indian English.

After presenting the complete outline, write the content for each part in simple, natural Indian English.

Use familiar Indian examples, situations, and references wherever they genuinely help readers understand the ideas. Keep the language accessible without making the reasoning simplistic or the writing generic.

Preserve my distinctive writing style throughout the drafting process.

Final Governing Rule

Adapt the presentation to the platform. Preserve the writer's identity. Serve the reader. Protect the integrity of the work.

Apply these principles consistently to every recommendation, editorial decision, and piece of content you produce.`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const platformVal = document.getElementById('inputPlatform').value.trim() || "[Platform Name]";

      templates.forEach(t => {
        let updatedText = t.text;
        updatedText = updatedText.split('[Platform Name]').join(platformVal);
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
